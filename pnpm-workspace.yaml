packages:
  - 'packages/galvanized-pukeko-vue-ui'
  - 'packages/galvanized-pukeko-web-client'

# ONE entry per package name, versions joined with `||`. A second entry naming the
# same package is silently ignored: pnpm returns on the first rule whose name
# matches, so a later line for that package is never consulted and the version it
# names is still refused. Splitting these into a line per version looks tidier and
# switches the exception off without any error.
#
# `pnpm install` appends a plain `name@version` line of its own when it meets an
# immature package, which lands after these and is therefore dead on arrival. When
# a new gaunt-sloth release is pinned, fold its version into the entry below and
# delete the appended line.
minimumReleaseAgeExclude:
  - '@gaunt-sloth/agent@2.0.0-beta.6||2.0.0-beta.7'
  - '@gaunt-sloth/core@2.0.0-beta.6||2.0.0-beta.7'

# @gaunt-sloth/agent is consumed from the public npm registry (2.0.0-beta.x);
# no cross-repo file: redirect is needed — the published package pins its own
# @gaunt-sloth/core by version. The uuid floor keeps a single resolved copy.
overrides:
  uuid: '>=11.1.1'
  # Hold the gaunt-sloth subtree on zod 4, scoped so this repo's own zod 3 and
  # zod-to-json-schema@3 are untouched — that isolation is the point (GS2-15)
  # and stays whatever these three do. @gaunt-sloth/* now declares `^4.4.3`,
  # which admits no zod 3, so pnpm can no longer dedupe the subtree onto zod 3
  # and these entries are redundant rather than load-bearing. Removing them is
  # its own ticket: measure the resolved zod copies before and after, because
  # the failure they were added for was a silent boot crash in the AG-UI server.
  '@gaunt-sloth/core>zod': '^4.0.0'
  '@gaunt-sloth/agent>zod': '^4.0.0'
  '@gaunt-sloth/review>zod': '^4.0.0'
